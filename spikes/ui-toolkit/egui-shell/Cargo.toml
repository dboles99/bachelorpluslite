[workspace]
# Standalone workspace on purpose -- see the note in the slint-shell manifest.

[package]
name = "spike-egui-shell"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = "0.36"
egui = "0.36"

# Identical to the slint spike. Comparing release profiles that differ would
# make the binary-size and startup numbers meaningless.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
