# A standalone workspace, deliberately, exactly like a spike.
#
# It is not a member of the root workspace because it exists to feed hostile
# input to crates that must survive it, and nothing it drags in -- proptest,
# the corpus, and one day a libFuzzer runner -- belongs in the dependency
# graph of the shipped application. `[workspace]` below is what detaches it;
# without that line cargo refuses to build a package that sits inside another
# workspace's directory without being listed in its members.
#
# `.gitignore` already anticipates this: "any standalone workspace (a spike, a
# fuzz target) has its own target directory".
[package]
name = "bp-fuzz"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
# The crates under test. Path dependencies into the root workspace: this
# package reads them, it is not read by them, so nothing here can reach the
# application.
bp-core = { path = "../crates/bp-core" }
bp-crypto = { path = "../crates/bp-crypto" }
bp-data = { path = "../crates/bp-data" }
bp-files = { path = "../crates/bp-files" }
bp-formats = { path = "../crates/bp-formats" }
bp-notebook = { path = "../crates/bp-notebook" }

proptest = "1"
serde_json = "1"
tempfile = "3"
