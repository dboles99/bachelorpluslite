[workspace]
resolver = "2"
members = [
    "apps/bachelorpad",
    "crates/bp-core",
    "crates/bp-editor",
    "crates/bp-buffer",
    "crates/bp-files",
    "crates/bp-formats",
    "crates/bp-search",
    "crates/bp-semantic",
    "crates/bp-naming",
    "crates/bp-organize",
    "crates/bp-storage",
    "crates/bp-history",
    "crates/bp-clipboard",
    "crates/bp-notebook",
    "crates/bp-execution",
    "crates/bp-data",
    "crates/bp-research",
    "crates/bp-security",
    "crates/bp-crypto",
    "crates/bp-secrets",
    "crates/bp-integrity",
    "crates/bp-redaction",
    "crates/bp-audit",
    "crates/bp-theme",
    "crates/bp-platform",
    "crates/bp-platform-windows",
    "crates/bp-platform-linux",
    "crates/bp-ui"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["BachelorPad+ contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
