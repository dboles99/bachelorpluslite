[workspace]
resolver = "2"
# Only crates with real content are members. The full intended crate map --
# including the ~22 not yet created -- lives in
# docs/architecture/ARCHITECTURE.md, which is where a plan belongs; an empty
# crate is a compile unit and a merge surface, not a plan. Add a crate here
# when there is something to put in it.
members = [
    "apps/bachelorpad",
    "crates/bp-buffer",
    "crates/bp-config",
    "crates/bp-core",
    "crates/bp-editor",
    "crates/bp-formats",
    "crates/bp-history",
    "crates/bp-naming",
    "crates/bp-platform",
    "crates/bp-search",
    "crates/bp-security",
    "crates/bp-semantic",
    "crates/bp-storage",
    "crates/bp-files",
    "crates/bp-theme",
    "crates/bp-ui",
    "tests/integration",
]

# Lints every member opts into with `[lints] workspace = true`.
#
# **These four were already at zero before they were switched on.** An audit
# of the fifth session counted the panic surface of production library code
# across all 24 crates and found not one `unwrap()`, `panic!`, `todo!` or
# `unimplemented!` -- every hit was a test module or a benchmark. That is a
# discipline worth having and it was held by whoever was writing remembering
# it, which is not a mechanism. This is the mechanism.
#
# `warn` rather than `deny` on purpose: the gate runs clippy with
# `-D warnings`, so these fail the build there, while an editor and a local
# `cargo clippy` show them as warnings and let work in progress compile.
#
# Not enabled, and each for a reason rather than an oversight:
# `expect_used` (nine in library code, all carrying a message that says what
# was assumed, which is what `expect` is for), `unreachable` (one), and
# `indexing_slicing` (thirty-six, mostly over slices just measured). Turning
# any of them on is a change to the code, not a change to the policy, and
# wants its own pass.
[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.package]
# 0.9.5, not 0.1.0: the first public release (ADR-0071). The number says
# what the product is -- feature-complete against what it set out to be,
# and short of 1.0 by the manual passes `project/NEXT_SESSION.md` section
# 3 still lists as undone.
#
# Nothing else needs editing for a version bump: both release scripts ask
# the binary rather than reading a manifest, so the archive name, BUILD.txt
# and the About box all follow from this line.
version = "0.9.5"
edition = "2024"
# GPL-3.0-only, and the `-only` is the decision (ADR-0071). Slint is
# tri-licensed and the branch this product takes is **GPL-3.0-only**; a
# project saying "or later" would let a recipient elect a GPLv4 that Slint's
# grant does not cover, which is the same defect this field had before, one
# version on.
#
# `--version` and the About box both print this string -- `env!("CARGO_PKG_LICENSE")`
# -- so the claim has a reader in the shipped binary rather than living only
# in a manifest nothing consults.
license = "GPL-3.0-only"
# Both lines, because this is a derived work: BachelorPlusLite is a clone of
# BachelorPad+ and inherits its authorship rather than replacing it.
authors = ["BachelorPlusLite contributors", "BachelorPad+ contributors"]
description = "BachelorPlusLite -- a lightweight Notepad-style text editor, derived from BachelorPad+."
repository = "https://github.com/dboles99/bachelorpluslite"

[workspace.dependencies]
anyhow = "1"
csv = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# `local-offset` is needed because every timestamp we show the user (last
# save, checkpoint, filename date) is a local wall-clock value, not UTC.
time = { version = "0.3", features = ["local-offset"] }
tempfile = "3"
proptest = "1"
toml = "1"
# Legacy encodings (ADR-0085). Windows-1252, Shift-JIS, GBK and the rest are
# what every "ANSI" file a Windows user has saved is in, and Notepad opens
# them. `encoding_rs` is the Encoding Standard's implementation that Firefox
# ships, decoding and encoding both; `chardetng`, by the same author, guesses
# which one an unmarked file is in. Both are build-time-checked by
# `cargo deny check licenses`.
encoding_rs = "0.8"
chardetng = { version = "1", default-features = false }

# --- cryptography (ADR-0021) -------------------------------------------
# All RustCrypto, all composed rather than reimplemented, which is the line
# ADR-0011 draws. Pinned at the workspace so one version of each primitive is
# in the tree -- two versions of an AEAD is two implementations to trust.
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
getrandom = "0.3"
# Only for naming recovery-journal files by a stable digest of the document's
# path (ADR-0022). Not used for key derivation -- that is Argon2id's job.
sha2 = "0.10"
# Ed25519 signatures (specs.md section 15). RustCrypto-adjacent, audited, and
# the conventional choice; composed, never reimplemented (ADR-0011).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

